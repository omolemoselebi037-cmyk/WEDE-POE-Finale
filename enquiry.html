<main id="main" class="bg bg-wedding">
<div class="page-title"><h1>Enquire and get a quote</h1><p>Fill in the form to see your estimated cost and date availability.</p></div>
<section class="section"><form class="box" id="enquiry-form" novalidate>
<div><label for="name">Full name</label><input id="name" name="name" required minlength="2" maxlength="60" autocomplete="name"><span class="err"></span></div>
<div><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"><span class="err"></span></div>
<div><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" required placeholder="071 786 6950" pattern="[0-9+()\s-]{10,16}" autocomplete="tel"><span class="err"></span></div>
<div><label for="service">Service</label><select id="service" name="service" required><option value="">Choose a service</option></select><span class="err"></span></div>
<div><label for="date">Event date</label><input id="date" name="date" type="date" required><span class="err"></span></div>
<div><label for="hours">Hours of coverage</label><input id="hours" name="hours" type="number" min="1" max="12" value="2" required><span class="err"></span></div>
<fieldset class="checks"><legend><strong>Extras</strong></legend><label><input type="checkbox" name="extra" value="800"> Photo album (R800)</label><label><input type="checkbox" name="extra" value="1200"> Second photographer (R1 200)</label><label><input type="checkbox" name="extra" value="600"> Same-day edits (R600)</label></fieldset>
<button class="btn" type="submit">Get my quote</button>
<div id="quote" class="result" hidden aria-live="polite"></div></form></section>
